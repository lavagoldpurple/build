name: Build Radxa E20C

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-e20c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ubuntu Noble minimal image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build requirements
        run: |
          sudo ./compile.sh requirements
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          sudo chmod -R u+rwX "$GITHUB_WORKSPACE"

      - name: Validate E20C runtime contracts
        run: bash tools/test-e20c-runtime.sh

      - name: Build E20C image
        run: |
          ./compile.sh build \
            BOARD=radxa-e20c \
            BRANCH=vendor \
            RELEASE=noble \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            SKIP_COMPRESSING=img \
            SHARE_LOG=yes \
            EXPERT=yes

      - name: Validate E20C image layout
        run: |
          find output/images -maxdepth 1 -type f -printf '%f\n' | sort
          image="$(find output/images -maxdepth 1 -type f -name '*.img' -print -quit)"
          test -n "$image" || { echo 'raw E20C image was not produced' >&2; exit 1; }
          sudo bash tools/validate-e20c-image.sh "$image"

      - name: Compress E20C raw image
        run: |
          shopt -s nullglob
          for image in output/images/*.img; do
            xz -T0 -1 -k "$image"
            sha256sum -b "$image.xz" | awk '{split($2, a, "/"); print $1, a[length(a)]}' > "$image.xz.sha"
            rm -f "$image" "$image.sha"
          done

      - name: Upload E20C firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radxa-e20c-${{ github.sha }}
          path: |
            output/images/**
            output/logs/**
          if-no-files-found: error
          retention-days: 14
